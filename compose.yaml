services:
  byparr:
    image: ghcr.io/thephaseless/byparr:latest
    container_name: byparr
    restart: unless-stopped
    # environment:
    #   LOG_LEVEL: debug
    build:
      context: .
      dockerfile: Dockerfile
      shm_size: "1gb"
    # Offload disk operations to RAM without imposing fixed capacity limits:
    # tmpfs:
    #  - /tmp:exec,mode=1777
    #  - /cache:mode=1777
    # Uncomment below to use byparr outside of internal network
    ports:
      - "8191:8191"
